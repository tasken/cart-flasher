name: Bug report
description: Tell us what failed in Cart-Flasher
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a request to support an unsupported flashcart, open an issue at
        [ntrteam/flashcart_core](https://github.com/ntrteam/flashcart_core).
        Report Cart-Flasher app bugs here.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the action you were trying to complete.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: List the exact actions that led to the problem.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. Press '...'
        4. Observe the error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / log output
      description: |
        Add a photo or screenshot when possible. For detection or flash-operation
        problems, press **Y** on the flashcart-selection screen until the log
        level is **DEBUG**, reproduce the problem, power off, and attach
        `cart-backups/cart_flasher.log`. If SD initialization fails, attach a
        photo instead.
    validations:
      required: false

  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - DS / DS Lite
        - DSi / DSi XL
        - 3DS family (in DS mode)
        - Other
    validations:
      required: true

  - type: input
    id: launcher
    attributes:
      label: Launched via
      placeholder: e.g. ntrboot, TWiLight Menu++, an R4-family loader
    validations:
      required: true

  - type: dropdown
    id: flashcart
    attributes:
      label: Flashcart
      options:
        - Ace3DS Plus
        - AK2i
        - DSTT
        - R4iSDHC family
        - R4i Gold 3DS
        - Other / clone / bootleg
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cart-Flasher version or commit
      description: Use the version shown on the flashcart-selection screen, or the .nds filename.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
