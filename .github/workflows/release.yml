name: Build Cart-Flasher release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    env:
      BLOCKSDS: /opt/wonderful/thirdparty/blocksds/core
    name: Build with BlocksDS toolchain using official Docker image
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Refresh BlocksDS packages
        run: |
          wf-pacman -Syu --noconfirm
          wf-config clean-caches --all
      - name: Initialize core submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --checkout arm9/vendor/flashcart_core arm9/vendor/libncgc
      - name: Build app
        id: build
        # NDS_OUT is fixed so every release carries an identically-named asset,
        # keeping the /releases/latest/download/cart_flasher.nds URL permanent.
        # The build identity remains available in the in-app boot screen.
        run: |
          # actions/checkout owns this workspace, while the BlocksDS container
          # runs as a different UID. Trust this exact checkout so Makefile's
          # build-summary git lookup does not emit a dubious-ownership error.
          SHORT_SHA=$(printf '%.7s' "$GITHUB_SHA")
          make NDS_OUT=cart_flasher.nds CART_FLASHER_COMMIT="$SHORT_SHA" CART_FLASHER_VERSION=${{ github.ref_name }} CART_FLASHER_BUILD_KIND=Release
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends gh
          rm -rf /var/lib/apt/lists/*
      - name: Verify GitHub CLI authentication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}" --jq .full_name
      - name: Preserve release test ROM
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cart_flasher-nightly-${{ steps.build.outputs.short_sha }}
          path: cart_flasher.nds
          if-no-files-found: error
          retention-days: 14
      - name: Upload cart_flasher.nds
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          # Without this gh shells out to git to work out which repo it is in,
          # and the container's UID doesn't own the workspace, so git refuses
          # it as "dubious ownership" and the upload fails after a successful
          # build. Naming the repo skips that lookup entirely.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" cart_flasher.nds --clobber
